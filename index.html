<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ludmilla Énergie</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Raleway:wght@300;400&family=Allura&display=swap');

  :root{
    --noir: #09070a;
    --or: #c8a96e;
    --or-clair: #e2caa0;
    --ivoire: #f3ead9;
  }

  html, body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(120% 90% at 50% 0%, rgba(200,169,110,0.10), transparent 60%),
                linear-gradient(180deg, var(--noir) 0%, #120e13 100%);
    font-family:'Raleway', sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }

  .contenu{
    padding: 40px;
  }

  .signature{
    font-family:'Allura', cursive;
    font-size:56px;
    color: var(--or);
    margin-bottom: 18px;
  }

  .message{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:20px;
    color: var(--ivoire);
    opacity:0.85;
    max-width: 420px;
    margin: 0 auto;
    line-height:1.6;
  }
</style>
</head>
<body>
  <div class="contenu">
    <div class="signature">Ludmilla Énergie</div>
    <p class="message">Ce site prend forme. Reviens bientôt pour découvrir les oracles et l'univers de la Traversée.</p>
  </div>
</body>
</html>
